# cargo-deny — polityka zależności (WP-011).
# Ten plik istnieje od WP-010; egzekwowanie w CI dołącza WP-011.

[graph]
# Budujemy i sprawdzamy wyłącznie x86_64-linux (CI); filtr odcina
# opcjonalne backendy innych platform (np. fiat-crypto).
targets = ["x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
