[package]
name = "ft-threshold-protocol"
description = "P2: maszyny stanów DKG/sign/refresh, komunikaty, transkrypt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# WP-025: jawny NTRU (`verify_plaintext`) i przejście `validate_ntru`
# istnieją wyłącznie w buildzie testowym. Build PROD (bez tej cechy)
# nie zawiera tych symboli — egzekwuje to `ci/check_prod_symbols.sh`.
test-oracle = []

[dependencies]
ft-threshold-core = { version = "0.1.0", path = "../ft-threshold-core" }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1"
